name: build

# Three machines build the same code on every push to main.
# The determinism step below is the one that needs all three to mean anything.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Every `run:` happens in the app's own checkout. Both repositories are
    # checked out side by side below, because package.json resolves paneless
    # as `file:../paneless-workspace/packages/paneless` and actions/checkout
    # can only write inside the workspace -- so the app cannot sit AT the
    # workspace root and still have a sibling.
    defaults:
      run:
        working-directory: cv-lab-2

    strategy:
      # Don't cancel the other two when one fails -- you want to see all three
      # failures at once, not discover them one release at a time.
      fail-fast: false
      matrix:
        os:
          - macos-14 # arm64
          - windows-2022 # x64
          - ubuntu-22.04 # x64, older glibc for wider compatibility

    steps:
      - uses: actions/checkout@v4
        with:
          path: cv-lab-2

      # The renderer is Svelte on top of paneless, which lives in a separate
      # PRIVATE repository and is consumed from a relative path rather than the
      # registry. The default GITHUB_TOKEN is scoped to this repository alone,
      # so this needs a PAT with read access to paneless-workspace, stored as
      # the PANELESS_TOKEN secret.
      #
      # Checked BEFORE the checkout so the failure names the fix, rather than
      # arriving as "repository not found" from actions/checkout or, worse, as
      # a confusing npm ci error three steps later.
      - name: Check the paneless token is configured
        working-directory: .
        shell: bash
        run: |
          if [ -z "${{ secrets.PANELESS_TOKEN }}" ]; then
            echo "::error::PANELESS_TOKEN is not set."
            echo "The renderer depends on BradDunagan/paneless-workspace, which is private."
            echo "Create a fine-grained PAT with read access to it and add it as the"
            echo "PANELESS_TOKEN repository secret. Alternatively make that repo public,"
            echo "or vendor paneless into this one."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: BradDunagan/paneless-workspace
          token: ${{ secrets.PANELESS_TOKEN }}
          path: paneless-workspace

      # Must be >= 22.12. Electron 43, @electron/rebuild 4 and node-gyp 13 all
      # declare it, and node-gyp 13's bundled undici genuinely breaks on Node 20
      # with "webidl.util.markAsUncloneable is not a function" during configure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cv-lab-2/package-lock.json

      # xvfb provides the virtual display the renderer tests need: Electron
      # cannot open a window on a headless Linux runner, and `show: false` is
      # not the same as needing no display.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential xvfb

      - run: npm ci

      # Strict compile of the pure-C sources. Runs on Linux and macOS because
      # it needs a POSIX compiler; the Linux run is the one that matters, since
      # glibc gates POSIX declarations that Apple's libc exposes unconditionally
      # -- which is exactly how an implicit posix_memalign declaration survived
      # unnoticed on every Linux build for weeks.
      - name: Lint native sources
        if: runner.os != 'Windows'
        run: npm run lint:native

      # Build against the Node ABI first so the smoke test can run headlessly.
      - name: Build addon (Node ABI)
        run: npm run build:native

      - name: Smoke test
        run: npm run test:native

      # Pure JS, no addon needed -- runs even if the native build were skipped.
      - name: Lab tests
        run: npm run test:lab

      # The one suite whose whole point is the matrix. It asserts literal
      # content hashes, so it is only meaningful because three machines with
      # three compilers and two instruction sets run it and have to agree --
      # on one machine alone it proves nothing. A failure HERE while the other
      # two jobs pass means the build stopped being bit-reproducible, not that
      # a kernel changed. See test/determinism.js and design-lab-model.md §5.
      - name: Determinism (must agree across all three platforms)
        run: npm run test:determinism

      # Executes the ```lab blocks in README.md. The documented pipeline
      # produced nothing at all for several commits: every stage succeeded and
      # every result was empty. Documentation that is never run is a claim.
      - name: README examples
        run: npm run test:readme

      # The renderer is a Vite build now, and test:renderer loads dist-renderer/
      # rather than the Svelte source. Without this the suite fails on a missing
      # page, which reads like a renderer bug and is not one.
      - name: Build renderer
        run: npm run build:renderer

      # Then rebuild against Electron's ABI -- a different NODE_MODULE_VERSION.
      # This is the step that would fail if the addon were NAN/V8 based.
      - name: Rebuild addon (Electron ABI)
        run: npm run rebuild:electron

      # The only suite that needs a real renderer. Two things exist nowhere
      # else: Chromium's image decoder, which `load` borrows, and the DOM, and
      # therefore the whole UI. Everything above this line runs headless under
      # plain node and would pass with the interface completely broken.
      - name: Renderer tests
        if: runner.os != 'Linux'
        run: npm run test:renderer

      - name: Renderer tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:renderer

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: cvlab-addon-${{ matrix.os }}
          path: cv-lab-2/build/Release/*.node
          if-no-files-found: error

      # --- packaging -------------------------------------------------------
      # Unsigned. Enough to install and run on a real machine, which is the
      # only way to test the UI on a platform you do not own.
      - name: Package
        run: npm run package
        env:
          # Stops electron-builder hunting for a signing identity in the
          # runner's keychain and failing when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Catches the failure that nothing else does: the addon compiles, the
      # installers build, and the app still dies on launch because the .node
      # was dropped from the bundle or stranded inside app.asar.
      - name: Verify package layout
        run: npm run verify:package

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cvlab-installers-${{ matrix.os }}
          path: |
            cv-lab-2/dist/*.dmg
            cv-lab-2/dist/*.zip
            cv-lab-2/dist/*.exe
            cv-lab-2/dist/*.AppImage
            cv-lab-2/dist/*.deb
          if-no-files-found: error
          # ~120 MB per platform; no reason to keep them for the default 90 days.
          retention-days: 14

# Not here yet, deliberately -- see docs/electron-guide.md for the order to add
# them in:
#   * packaging (electron-builder) into .dmg / .exe / .AppImage
#   * macOS signing + notarization      (needs Apple Developer, $99/yr)
#   * Windows signing                   (needs an HSM-backed cert)
#   * publishing releases + auto-update manifests
