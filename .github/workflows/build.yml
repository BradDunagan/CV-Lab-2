name: build

# Three machines build the same code on every push to main.
# The determinism step below is the one that needs all three to mean anything.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Every `run:` happens in the app's own checkout. Both repositories are
    # checked out side by side below, because package.json resolves paneless
    # as `file:../paneless-workspace/packages/paneless` and actions/checkout
    # can only write inside the workspace -- so the app cannot sit AT the
    # workspace root and still have a sibling.
    defaults:
      run:
        working-directory: cv-lab-2

    strategy:
      # Don't cancel the other two when one fails -- you want to see all three
      # failures at once, not discover them one release at a time.
      fail-fast: false
      matrix:
        os:
          - macos-14 # arm64
          - windows-2022 # x64
          - ubuntu-22.04 # x64, older glibc for wider compatibility

    steps:
      - uses: actions/checkout@v4
        with:
          path: cv-lab-2

      # The renderer is Svelte on top of paneless, which lives in a separate
      # PRIVATE repository and is consumed from a relative path rather than the
      # registry. The default GITHUB_TOKEN is scoped to this repository alone,
      # so this needs a PAT with read access to paneless-workspace, stored as
      # the PANELESS_TOKEN secret.
      #
      # This step USES the token rather than merely checking it is present.
      # The difference is not academic: an earlier version only tested that
      # the secret was non-empty, a 15-character string that was not a token
      # sailed through it, and the real failure arrived one step later as a
      # bare "Bad credentials" from actions/checkout naming neither cause nor
      # fix. It took three round trips to work out.
      #
      # It also matters for the failure that has not happened yet. A PAT
      # expires. When this one does, checkout will start failing with nothing
      # pointing at the reason, quite possibly months from now -- so the three
      # cases that actually occur are told apart here, before anything else
      # runs.
      #
      # The token goes through the environment rather than being interpolated
      # into the script: `${{ }}` inline would break on a value containing a
      # quote, and env is the documented way to hand a secret to a shell.
      - name: Check the paneless token works
        working-directory: .
        shell: bash
        env:
          PANELESS_TOKEN: ${{ secrets.PANELESS_TOKEN }}
          PANELESS_REPO: BradDunagan/paneless-workspace
        run: |
          set -u
          fix() {
            echo "Fix: generate a fine-grained PAT at"
            echo "  https://github.com/settings/personal-access-tokens/new"
            echo "with Resource owner BradDunagan, Repository access limited to"
            echo "$PANELESS_REPO, and Permissions > Repository > Contents: Read-only."
            echo "Then store its VALUE (a ~93 character string starting github_pat_)"
            echo "as the PANELESS_TOKEN repository secret:"
            echo "  gh secret set PANELESS_TOKEN --repo BradDunagan/CV-Lab-2"
          }

          if [ -z "$PANELESS_TOKEN" ]; then
            echo "::error::PANELESS_TOKEN is not set."
            echo "The renderer depends on $PANELESS_REPO, which is private."
            fix
            exit 1
          fi

          # Body and status in one call, no temp file -- Git Bash on the
          # Windows runner has a different idea of /tmp than the other two.
          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $PANELESS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$PANELESS_REPO") || {
              echo "::error::could not reach api.github.com to validate PANELESS_TOKEN."
              exit 1
            }
          code=$(printf '%s' "$response" | tail -n 1)

          case "$code" in
            200)
              echo "PANELESS_TOKEN can read $PANELESS_REPO."
              ;;
            401)
              echo "::error::PANELESS_TOKEN is set, but GitHub rejects it (401)."
              echo "The token is expired, revoked, or is not a GitHub token at all."
              fix
              exit 1
              ;;
            403|404)
              echo "::error::PANELESS_TOKEN is a valid token but cannot read $PANELESS_REPO ($code)."
              echo "GitHub returns 404 rather than 403 for a private repository the"
              echo "token cannot see, so this is almost always scope rather than"
              echo "permissions: check the resource owner, that $PANELESS_REPO is"
              echo "among the selected repositories, and that Contents is granted."
              fix
              exit 1
              ;;
            *)
              echo "::error::unexpected $code from api.github.com validating PANELESS_TOKEN."
              # The body may explain it and never contains the token.
              printf '%s' "$response" | sed '$d'
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          repository: BradDunagan/paneless-workspace
          token: ${{ secrets.PANELESS_TOKEN }}
          path: paneless-workspace

      # pt-lab is the image generator's path tracer, and image generation ships
      # AS PART OF THE APP -- varying lighting and pose to test a pipeline
      # against is the point of the lab, not a developer convenience. So the
      # package job needs it, exactly as it needs paneless for the renderer.
      #
      # No token: unlike paneless-workspace this repository is public. The
      # directory name differs from the repository name on purpose -- every
      # path in cv-lab-2 expects a `pt-lab-workspace` sibling.
      - uses: actions/checkout@v4
        with:
          repository: BradDunagan/pt-lab
          path: pt-lab-workspace

      # Must be >= 22.12. Electron 43, @electron/rebuild 4 and node-gyp 13 all
      # declare it, and node-gyp 13's bundled undici genuinely breaks on Node 20
      # with "webidl.util.markAsUncloneable is not a function" during configure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cv-lab-2/package-lock.json

      # xvfb provides the virtual display the renderer tests need: Electron
      # cannot open a window on a headless Linux runner, and `show: false` is
      # not the same as needing no display.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential xvfb

      - run: npm ci

      # pt-lab is consumed from SOURCE through a Vite alias, so building the
      # generator compiles its TypeScript here -- and therefore has to resolve
      # pt-lab's own runtime dependencies (three, three-gpu-pathtracer,
      # oidn-web) out of ITS node_modules. Same shape as the paneless step
      # below, and for the same reason.
      - name: Install pt-lab's dependencies
        working-directory: pt-lab-workspace
        run: npm ci

      # paneless is consumed from SOURCE, not from a published package, so
      # Vite compiles its TypeScript and Svelte here -- and therefore has to
      # resolve paneless's own runtime dependencies (d3, monaco-editor).
      # cv-lab-2's npm ci only symlinks paneless; it does not install anything
      # inside it. paneless-workspace is an npm workspaces monorepo, so one
      # `npm ci` at its root installs them and Node's upward resolution finds
      # them from paneless's source files.
      #
      # This is invisible locally, where that node_modules already exists from
      # working in the sibling repo. The same shape as the posix_memalign
      # warning: an environment difference only the matrix can see.
      - name: Install paneless dependencies
        working-directory: paneless-workspace
        run: npm ci

      # Strict compile of the pure-C sources. Runs on Linux and macOS because
      # it needs a POSIX compiler; the Linux run is the one that matters, since
      # glibc gates POSIX declarations that Apple's libc exposes unconditionally
      # -- which is exactly how an implicit posix_memalign declaration survived
      # unnoticed on every Linux build for weeks.
      - name: Lint native sources
        if: runner.os != 'Windows'
        run: npm run lint:native

      # Build against the Node ABI first so the smoke test can run headlessly.
      - name: Build addon (Node ABI)
        run: npm run build:native

      - name: Smoke test
        run: npm run test:native

      # Pure JS, no addon needed -- runs even if the native build were skipped.
      - name: Lab tests
        run: npm run test:lab

      # The one suite whose whole point is the matrix. It asserts literal
      # content hashes, so it is only meaningful because three machines with
      # three compilers and two instruction sets run it and have to agree --
      # on one machine alone it proves nothing. A failure HERE while the other
      # two jobs pass means the build stopped being bit-reproducible, not that
      # a kernel changed. See test/determinism.js and design-lab-model.md §5.
      - name: Determinism (must agree across all three platforms)
        run: npm run test:determinism

      # Executes the ```lab blocks in README.md. The documented pipeline
      # produced nothing at all for several commits: every stage succeeded and
      # every result was empty. Documentation that is never run is a claim.
      - name: README examples
        run: npm run test:readme

      # The renderer is a Vite build now, and test:renderer loads dist-renderer/
      # rather than the Svelte source. Without this the suite fails on a missing
      # page, which reads like a renderer bug and is not one.
      - name: Build renderer
        run: npm run build:renderer

      # Then rebuild against Electron's ABI -- a different NODE_MODULE_VERSION.
      # This is the step that would fail if the addon were NAN/V8 based.
      - name: Rebuild addon (Electron ABI)
        run: npm run rebuild:electron

      # The only suite that needs a real renderer. Two things exist nowhere
      # else: Chromium's image decoder, which `load` borrows, and the DOM, and
      # therefore the whole UI. Everything above this line runs headless under
      # plain node and would pass with the interface completely broken.
      - name: Renderer tests
        if: runner.os != 'Linux'
        run: npm run test:renderer

      - name: Renderer tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:renderer

      # The batch runner spawns Electron, so it needs a display for the same
      # reason the renderer suite does -- `load` borrows Chromium's decoder,
      # which only exists in a renderer.
      - name: Batch runner tests
        if: runner.os != 'Linux'
        run: npm run test:cli

      - name: Batch runner tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:cli

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: cvlab-addon-${{ matrix.os }}
          path: cv-lab-2/build/Release/*.node
          if-no-files-found: error

      # --- packaging -------------------------------------------------------
      # Unsigned. Enough to install and run on a real machine, which is the
      # only way to test the UI on a platform you do not own.
      - name: Package
        run: npm run package
        env:
          # Stops electron-builder hunting for a signing identity in the
          # runner's keychain and failing when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Catches the failure that nothing else does: the addon compiles, the
      # installers build, and the app still dies on launch because the .node
      # was dropped from the bundle or stranded inside app.asar.
      - name: Verify package layout
        run: npm run verify:package

      # Layout is not behaviour, and the difference has already cost this
      # project a release. Every check above passed while the packaged app was
      # dead on launch: the preload required a file that was never in the
      # bundle, threw, and the window came up with no `window.lab` at all. This
      # starts the real artifact and asks whether it works.
      - name: Smoke-test the packaged app
        if: runner.os != 'Linux'
        run: npm run smoke:package

      - name: Smoke-test the packaged app (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run smoke:package

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cvlab-installers-${{ matrix.os }}
          path: |
            cv-lab-2/dist/*.dmg
            cv-lab-2/dist/*.zip
            cv-lab-2/dist/*.exe
            cv-lab-2/dist/*.AppImage
            cv-lab-2/dist/*.deb
          if-no-files-found: error
          # ~120 MB per platform; no reason to keep them for the default 90 days.
          retention-days: 14

# Not here yet, deliberately -- see docs/electron-guide.md for the order to add
# them in:
#   * packaging (electron-builder) into .dmg / .exe / .AppImage
#   * macOS signing + notarization      (needs Apple Developer, $99/yr)
#   * Windows signing                   (needs an HSM-backed cert)
#   * publishing releases + auto-update manifests
