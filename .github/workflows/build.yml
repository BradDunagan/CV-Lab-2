name: build

# Inert until this directory is a git repo with a GitHub remote.
# Once it is: `git push` and watch three machines build the same code.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Don't cancel the other two when one fails -- you want to see all three
      # failures at once, not discover them one release at a time.
      fail-fast: false
      matrix:
        os:
          - macos-14 # arm64
          - windows-2022 # x64
          - ubuntu-22.04 # x64, older glibc for wider compatibility

    steps:
      - uses: actions/checkout@v4

      # Must be >= 22.12. Electron 43, @electron/rebuild 4 and node-gyp 13 all
      # declare it, and node-gyp 13's bundled undici genuinely breaks on Node 20
      # with "webidl.util.markAsUncloneable is not a function" during configure.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - run: npm ci

      # Build against the Node ABI first so the smoke test can run headlessly.
      - name: Build addon (Node ABI)
        run: npm run build:native

      - name: Smoke test
        run: npm run test:native

      # Pure JS, no addon needed -- runs even if the native build were skipped.
      - name: Lab tests
        run: npm run test:lab

      # Then rebuild against Electron's ABI -- a different NODE_MODULE_VERSION.
      # This is the step that would fail if the addon were NAN/V8 based.
      - name: Rebuild addon (Electron ABI)
        run: npm run rebuild:electron

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: cvlab-addon-${{ matrix.os }}
          path: build/Release/*.node
          if-no-files-found: error

      # --- packaging -------------------------------------------------------
      # Unsigned. Enough to install and run on a real machine, which is the
      # only way to test the UI on a platform you do not own.
      - name: Package
        run: npm run package
        env:
          # Stops electron-builder hunting for a signing identity in the
          # runner's keychain and failing when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Catches the failure that nothing else does: the addon compiles, the
      # installers build, and the app still dies on launch because the .node
      # was dropped from the bundle or stranded inside app.asar.
      - name: Verify package layout
        run: npm run verify:package

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: cvlab-installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          # ~120 MB per platform; no reason to keep them for the default 90 days.
          retention-days: 14

# Not here yet, deliberately -- see docs/electron-guide.md for the order to add
# them in:
#   * packaging (electron-builder) into .dmg / .exe / .AppImage
#   * macOS signing + notarization      (needs Apple Developer, $99/yr)
#   * Windows signing                   (needs an HSM-backed cert)
#   * publishing releases + auto-update manifests
