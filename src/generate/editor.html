<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Served from gen://editor -- deliberately a different origin from the
      generator's gen://lab, so the models imported here, which pt-lab keeps
      in its origin's IndexedDB, can never turn up in a render. The policy is
      otherwise the generator page's: wasm-unsafe-eval for the denoiser, blob:
      for the object URLs three.js makes while parsing a model.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:"
    />
    <title>CV-Lab scene editor</title>
    <style>
      :root {
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        color-scheme: dark;
        color: #ddd;
        background: #0b0b0f;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./editor.js"></script>
  </body>
</html>
