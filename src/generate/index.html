<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Served from the gen:// scheme, so 'self' is that origin. wasm-unsafe-eval
      is needed by oidn-web, the denoiser, which instantiates a WebAssembly
      module; it permits WASM compilation and nothing else — plain eval() and
      inline script stay refused. blob: covers the object URL pt-lab creates to
      hand the finished PNG to the download.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:"
    />
    <title>CV-Lab image generator</title>
    <style>
      /*
       * The canvas is `size` x `size` because that is the image being made,
       * and that has nothing to do with how much room there is to show it in.
       * Since the app embeds this page in a pane, the two are rarely equal:
       * centred and scaled to fit keeps the render where the eye expects it
       * instead of pinned to a corner with a black field beside it.
       *
       * Presentation only. max-width/max-height scale what is DRAWN and leave
       * the backing store alone, so the exported PNG is unaffected either way.
       */
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #1c1c1c;
        display: flex; align-items: center; justify-content: center;
      }
      #stage { display: block; max-width: 100%; max-height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <canvas id="denoise" hidden></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
