<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Unchanged in spirit from the pre-Svelte page: no remote origins, no eval.
      style-src gains 'unsafe-inline' because Svelte injects component styles as
      inline <style> elements at runtime -- which is inline STYLE, not inline
      script, and cannot execute anything.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:"
    />
    <title>CV-Lab</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
