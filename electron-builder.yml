appId: com.braddunagan.cvlab2
productName: CV-Lab

# --- The two traps this config exists to avoid -------------------------------
#
# 1. directories.buildResources defaults to "build", and electron-builder
#    EXCLUDES that directory from the packaged app. Our compiled addon lives at
#    build/Release/cvlab.node, so with the default the binary would be silently
#    dropped and the app would fail at launch. Point buildResources elsewhere.
#
# 2. dlopen/LoadLibrary are OS-level calls and cannot read a file from inside
#    an ASAR archive. Any .node must be unpacked to real disk. electron-builder
#    auto-detects native modules under node_modules/, but this addon is part of
#    the app itself, so it has to be listed explicitly.
#
# scripts/verify-package.js asserts both of these actually held, per platform.

directories:
  buildResources: electron-resources
  output: dist

asar: true
asarUnpack:
  - build/Release/*.node

# Still no runtime dependencies -- everything in package.json is a
# devDependency, including svelte, vite and paneless, because Vite BUNDLES the
# renderer into dist-renderer/ at build time. Nothing from node_modules is
# needed at runtime.
#
# Source that only a bundler can read is excluded, for both bundles. Shipping
# it would put two copies of the same thing in the package, one of which cannot
# run: src/renderer/ is the app's Svelte source, and src/generate/main.js and
# index.html are the generator page's -- both are already compiled, into
# dist-renderer/ and dist-generate/ respectively. src/generate/driver.js STAYS:
# it is main-process CommonJS, required at runtime, and is not bundled at all.
#
# dist-generate/ is the image generator: the pt-lab bundle plus the model, the
# environment and the denoiser weights the build copies in beside it. About
# 17 MB, and it is what makes generating fixtures a feature of the app rather
# than something only a working copy can do. It needs no asarUnpack -- verified
# rather than assumed: net.fetch on a file:// URL reads inside an .asar, and a
# 3.7 MB glTF comes back byte-identical.
# scripts/png.js is here because the PRELOAD requires it -- readPngColour is
# what lets `load` confirm a PNG's declared encoding rather than assume it. It
# is runtime code that happens to live in scripts/, and leaving it out made
# every packaged build dead on launch: the preload threw
# "Cannot find module '../scripts/png'", contextBridge never ran, and the
# renderer came up to "window.lab is missing". Nothing caught it, because
# verify-package checked the LAYOUT and never that the app runs -- it does now.
#
# Named file by file rather than scripts/**/*: the rest of that directory is
# CLI entry points and build tooling, which would be dead weight for exactly
# the reason the exclusions above exist.
files:
  - package.json
  - src/**/*
  - "!src/renderer/**/*"
  - "!src/generate/main.js"
  - "!src/generate/index.html"
  - scripts/png.js
  - dist-renderer/**/*
  - dist-generate/**/*
  - native/**/*.js
  - build/Release/*.node

mac:
  target:
    - dmg
    - zip # electron-updater needs the zip; dmg alone is not enough
  category: public.app-category.graphics-design
  # Unsigned for now. See docs/electron-guide.md for what signing adds and
  # what it costs; nothing here blocks on it.
  identity: null

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  target:
    - AppImage
    - deb
  category: Graphics
